info:
  name: Update Account
  type: http
  seq: 5

http:
  method: PUT
  url: "{{BASE_URL}}/accounts/{{ID}}"
  body:
    type: json
    data: |-
      {
        "balance":100
      }
  auth: inherit

runtime:
  variables:
    - name: id
      value: "3"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
